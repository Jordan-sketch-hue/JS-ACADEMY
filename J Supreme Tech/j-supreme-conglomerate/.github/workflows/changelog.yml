name: Update Changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Append to CHANGELOG.md
        run: |
          DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=format:'%s')
          AUTHOR=$(git log -1 --pretty=format:'%an')
          FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | head -20 | sed 's/^/  - /' || echo "  - (initial commit)")

          ENTRY="## $DATE · \`$COMMIT_SHA\`
**$COMMIT_MSG**
Author: $AUTHOR
Files changed:
$FILES

---
"

          if [ ! -f CHANGELOG.md ]; then
            echo "# Changelog — J Supreme Conglomerate" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "_Auto-generated on every deploy to main._" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

          # Prepend new entry after header
          HEADER=$(head -4 CHANGELOG.md)
          REST=$(tail -n +5 CHANGELOG.md)
          echo "$HEADER" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$ENTRY" >> CHANGELOG.md
          echo "$REST" >> CHANGELOG.md

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore: update changelog [skip ci]"
          git push
